apiVersion: apps/v1
kind: Deployment
metadata:
  name: acquirer
  labels:
    app.kubernetes.io/name: acquirer
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acquirer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acquirer
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: acquirer
          image: flutter-observability-lab-services:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: observability-config
          env:
            - name: ROLE
              value: acquirer
            - name: DD_SERVICE
              value: adquirente-mock
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  strategy:
    type: RollingUpdate
---
