apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: dashboard
          image: flutter-observability-lab-dashboard:local
          imagePullPolicy: Never
          env:
            - name: DD_ENV
              valueFrom:
                configMapKeyRef:
                  name: observability-config
                  key: DD_ENV
            - name: DD_VERSION
              valueFrom:
                configMapKeyRef:
                  name: observability-config
                  key: DD_VERSION
            - name: DD_SITE
              valueFrom:
                configMapKeyRef:
                  name: observability-config
                  key: DD_SITE
            - name: DD_RUM_SERVICE
              value: loja-app-pagamento-web
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
  strategy:
    type: RollingUpdate
